# Nagrik Setu backend configuration.
# Every secret is read from the environment. See ../../../../.env.example for the full list.
spring:
  application:
    name: nagrik-setu
  profiles:
    default: dev
  datasource:
    url: ${NAGRIK_DB_URL:jdbc:postgresql://localhost:5432/nagrik_setu}
    username: ${NAGRIK_DB_USERNAME:nagrik}
    password: ${NAGRIK_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: ${NAGRIK_MAX_FILE_SIZE:8MB}
      max-request-size: ${NAGRIK_MAX_REQUEST_SIZE:60MB}
      file-size-threshold: 1MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-swallow-size: 64MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

nagrik:
  security:
    jwt-secret: ${NAGRIK_JWT_SECRET:}
    jwt-expiry-minutes: ${NAGRIK_JWT_EXPIRY_MINUTES:480}
    cors-allowed-origins: ${NAGRIK_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    # Signed evidence URLs let <img> tags load protected photos without exposing the JWT.
    evidence-url-ttl-seconds: ${NAGRIK_EVIDENCE_URL_TTL_SECONDS:600}
    rate-limit:
      auth-per-minute: ${NAGRIK_RATE_LIMIT_AUTH_PER_MINUTE:20}
      complaints-per-hour: ${NAGRIK_RATE_LIMIT_COMPLAINTS_PER_HOUR:20}
      writes-per-minute: ${NAGRIK_RATE_LIMIT_WRITES_PER_MINUTE:120}
  evidence:
    max-files-per-request: ${NAGRIK_MAX_FILES_PER_REQUEST:6}
    max-file-size-bytes: ${NAGRIK_MAX_FILE_SIZE_BYTES:8388608}
  storage:
    # local | s3
    provider: ${NAGRIK_STORAGE_PROVIDER:local}
    local:
      # Persistent directory for uploaded evidence. Back it up together with the database.
      directory: ${NAGRIK_STORAGE_LOCAL_DIR:./storage/evidence}
    s3:
      bucket: ${NAGRIK_S3_BUCKET:}
      region: ${NAGRIK_S3_REGION:ap-south-1}
      # Leave empty for AWS. Set for MinIO / Cloudflare R2 / other S3-compatible services.
      endpoint: ${NAGRIK_S3_ENDPOINT:}
      path-style-access: ${NAGRIK_S3_PATH_STYLE:false}
      access-key: ${NAGRIK_S3_ACCESS_KEY:}
      secret-key: ${NAGRIK_S3_SECRET_KEY:}
      key-prefix: ${NAGRIK_S3_KEY_PREFIX:evidence/}
    orphan-cleanup:
      enabled: ${NAGRIK_ORPHAN_CLEANUP_ENABLED:true}
      # Files older than this with no evidence row are removed.
      min-age-minutes: ${NAGRIK_ORPHAN_MIN_AGE_MINUTES:60}
      cron: ${NAGRIK_ORPHAN_CLEANUP_CRON:0 17 3 * * *}
  ward-matching:
    # Complaints are only auto-matched when the point falls inside exactly one configured boundary.
    enabled: ${NAGRIK_WARD_MATCHING_ENABLED:true}
  demo:
    enabled: false
    password: ${NAGRIK_DEMO_PASSWORD:}
